name: CI

on:
  push:
  pull_request:

# A new push supersedes the running job for the same ref — otherwise two
# pushes run concurrently and both burn 2-vCPU runners for the full suite.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Safety net: without this, a hung step runs to GitHub's own 360-minute
    # default instead of failing fast. The full suite normally finishes in
    # well under 10 minutes with a warm Zig cache.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: sync-docs.sh needs git log per file

      # The Zig build cache is the difference between a ~1 min incremental run
      # and a multi-hour cold Debug compile. Key on the build inputs so a
      # source change only recompiles what actually changed; the global cache
      # (~/.cache/zig) keeps the toolchain artefacts across jobs.
      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', '**/*.zig', '**/*.s', '**/*.lua', '.zig-version') }}
          restore-keys: |
            zig-${{ runner.os }}-

      - name: Install Zig 0.16.0 (pinned by .zig-version)
        run: |
          curl -fLo /tmp/zig.tar.xz "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: Install QEMU, ISO tools and Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso mtools parted e2fsprogs lua5.4

      - name: Format check
        run: zig fmt --check .

      - name: Build
        run: zig build

      # Build-only matrix: proves the kernel compiles in every optimize mode
      # (a Debug-only or ReleaseFast-only bug must not hide). No release, no
      # tags — this is a compile check, not a packaging step.
      - name: Build (Debug)
        run: zig build -Doptimize=Debug

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Host unit tests
        run: zig build test

      - name: Lua shell regression tests
        run: zig build shell-test

      - name: Deterministic build (ADR-014)
        run: ./tools/verify-reproducible.sh

      - name: Boot smoke test (QEMU, TCG on CI runners)
        run: SMOKE_TIMEOUT=60 ./tools/qemu-smoke.sh

      - name: Storage boot smoke test (virtio-blk disk attached)
        run: |
          dd if=/dev/zero of=/tmp/aster-storage.img bs=1M count=16 status=none
          SMOKE_TIMEOUT=60 SMOKE_DISK=/tmp/aster-storage.img SMOKE_MARKER='[ OK ] storage' ./tools/qemu-smoke.sh

      - name: In-QEMU runtime tests
        run: QEMU_TEST_TIMEOUT=90 ./tools/qemu-test.sh

      - name: In-QEMU runtime tests with a test disk (filesystem, M6.1.5)
        run: |
          ./tools/make-test-disk.sh /tmp/aster-test-disk.img
          QEMU_TEST_TIMEOUT=90 QEMU_TEST_DISK=/tmp/aster-test-disk.img ./tools/qemu-test.sh

      - name: Boot log must match the code (proof of work stays current)
        run: BOOT_LOG_TIMEOUT=60 ./tools/capture-boot.sh --check

      - name: Docs must be synced with their spec sources (14 days)
        run: ./tools/sync-docs.sh --check

      - name: KI docs must match the code (ops, syscalls, statuses, bindings)
        run: ./tools/check-ki-docs.sh --check
